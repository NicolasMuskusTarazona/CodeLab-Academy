<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CodeLab Academy – Cursos</title>
  <meta name="description" content="Catálogo de cursos de CodeLab Academy: interfaz Bootstrap que consume una API REST en PHP.">
  <meta name="theme-color" content="#0f766e">
  <!-- URL base de la API (ruta relativa para que funcione en cualquier carpeta o subdominio).
       Valor "demo": datos en memoria, para GitHub Pages. Lo fija el workflow de despliegue. -->
  <meta name="api-base" content="api/v1/courses">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3C/text%3E%3C/svg%3E">
  <!-- Conexión anticipada al CDN que sirve el JavaScript de Bootstrap -->
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <!-- CSS generado por SASS: npm run sass -->
  <link rel="stylesheet" href="assets/css/main.css">
</head>
<body>
  <header class="site-header">
    <nav class="navbar">
      <div class="container">
        <a class="navbar-brand text-white" href="./">Code<span>Lab</span> Academy</a>
        <button type="button" class="btn btn-secondary" id="btn-new">+ Nuevo curso</button>
      </div>
    </nav>
    <div class="hero">
      <div class="container">
        <h1>Catálogo de cursos</h1>
        <p>Interfaz en Bootstrap 5 y SASS que consume la API REST en PHP con arquitectura MVC.</p>
        <span class="endpoint">GET /api/v1/courses</span>
        <span class="endpoint d-none" id="demo-badge">Modo demostración · datos en memoria</span>
      </div>
    </div>
  </header>

  <main class="container py-4">
    <form class="row g-2 mb-4" id="filters" role="search" autocomplete="off">
      <div class="col-12 col-md-6">
        <label for="f-q" class="visually-hidden">Buscar</label>
        <input type="search" class="form-control" id="f-q" placeholder="Buscar por título o descripción">
      </div>
      <div class="col-6 col-md-3">
        <label for="f-level" class="visually-hidden">Nivel</label>
        <select class="form-select" id="f-level">
          <option value="">Todos los niveles</option>
          <option value="basico">Básico</option>
          <option value="intermedio">Intermedio</option>
          <option value="avanzado">Avanzado</option>
        </select>
      </div>
      <div class="col-6 col-md-3">
        <label for="f-sort" class="visually-hidden">Ordenar</label>
        <select class="form-select" id="f-sort">
          <option value="id|asc">Más antiguos</option>
          <option value="id|desc">Más recientes</option>
          <option value="title|asc">Título A–Z</option>
          <option value="price|asc">Precio menor</option>
          <option value="price|desc">Precio mayor</option>
        </select>
      </div>
    </form>

    <noscript><p class="alert alert-danger">Esta aplicación necesita JavaScript para mostrar el catálogo.</p></noscript>
    <div id="status" aria-live="polite"></div>
    <div class="row g-4" id="grid"></div>

    <nav class="mt-4" aria-label="Paginación">
      <ul class="pagination justify-content-center" id="pager"></ul>
    </nav>
  </main>

  <footer class="site-footer text-center py-4">
    CodeLab Academy · Integración Full-Stack mediante API REST
  </footer>

  <!-- Modal crear / editar -->
  <div class="modal fade" id="course-modal" tabindex="-1" aria-labelledby="modal-title" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <form class="modal-content" id="course-form" novalidate>
        <div class="modal-header">
          <h2 class="modal-title fs-5" id="modal-title">Nuevo curso</h2>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
        </div>
        <div class="modal-body">
          <div class="alert alert-danger d-none" id="form-alert" role="alert"></div>
          <input type="hidden" id="c-id">

          <div class="mb-3">
            <label for="c-title" class="form-label">Título</label>
            <input type="text" class="form-control" id="c-title" name="title" maxlength="120" required>
            <div class="invalid-feedback"></div>
          </div>
          <div class="mb-3">
            <label for="c-description" class="form-label">Descripción</label>
            <textarea class="form-control" id="c-description" name="description" rows="3" maxlength="500" required></textarea>
            <div class="invalid-feedback"></div>
          </div>
          <div class="row g-3">
            <div class="col-12 col-sm-4">
              <label for="c-level" class="form-label">Nivel</label>
              <select class="form-select" id="c-level" name="level" required>
                <option value="">Seleccione…</option>
                <option value="basico">Básico</option>
                <option value="intermedio">Intermedio</option>
                <option value="avanzado">Avanzado</option>
              </select>
              <div class="invalid-feedback"></div>
            </div>
            <div class="col-6 col-sm-4">
              <label for="c-hours" class="form-label">Horas</label>
              <input type="number" class="form-control" id="c-hours" name="hours" min="1" max="500" required>
              <div class="invalid-feedback"></div>
            </div>
            <div class="col-6 col-sm-4">
              <label for="c-price" class="form-label">Precio (COP)</label>
              <input type="number" class="form-control" id="c-price" name="price" min="0" step="1000" required>
              <div class="invalid-feedback"></div>
            </div>
          </div>
          <div class="form-check form-switch mt-3">
            <input class="form-check-input" type="checkbox" role="switch" id="c-active" name="active" checked>
            <label class="form-check-label" for="c-active">Curso activo</label>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button>
          <button type="submit" class="btn btn-primary" id="btn-save">Guardar</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Modal confirmar eliminación -->
  <div class="modal fade" id="delete-modal" tabindex="-1" aria-labelledby="delete-title" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-sm">
      <div class="modal-content">
        <div class="modal-header">
          <h2 class="modal-title fs-5" id="delete-title">Eliminar curso</h2>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
        </div>
        <div class="modal-body" id="delete-text"></div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button>
          <button type="button" class="btn btn-danger" id="btn-confirm-delete">Eliminar</button>
        </div>
      </div>
    </div>
  </div>

  <div class="toast-area" id="toasts" aria-live="polite"></div>

  <!-- Versión alineada con el Bootstrap que compila SASS (5.3.8). defer: no bloquea el renderizado;
       integrity: el navegador rechaza el archivo si el CDN lo alterara. -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
          integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
          crossorigin="anonymous" defer></script>
  <!-- Módulo ES: se ejecuta diferido y, en producción, se entrega empaquetado y minificado -->
  <script type="module" src="assets/js/app.js"></script>
</body>
</html>
